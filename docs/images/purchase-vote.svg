<svg xmlns="http://www.w3.org/2000/svg" width="790" height="190" viewBox="0 0 790 190" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">해적 디펜스 멀티플레이 구매 투표</title>
  <desc id="desc">골드를 확인한 뒤 구매를 제안하고 최대 10초간 투표해 찬성이 더 많으면 구매하고 동점이거나 반대가 많으면 부결하는 흐름</desc>
  <style>
    text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }
    .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
    .name, .section { fill: #1e293b; font-weight: 700; }
    .name { font-size: 18px; text-anchor: middle; }
    .section { font-size: 17px; }
    .detail, .label { fill: #475569; font-size: 14px; text-anchor: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-linejoin: round; }
    .tip { fill: #64748b; }
    .rule { stroke: #d8e0e9; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #202d3b; stroke: #718396; }
      .name, .section { fill: #f2f6fb; }
      .detail, .label { fill: #c6d3e1; }
      .arrow { stroke: #a4b5c8; }
      .tip { fill: #a4b5c8; }
      .rule { stroke: #3d4b5a; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <g transform="translate(16 63)">
    <rect class="box" width="152" height="62" rx="10"/>
    <text class="name" x="76" y="27">구매 제안</text>
    <text class="detail" x="76" y="48">보유 골드 확인</text>
  </g>
  <g transform="translate(216 63)">
    <rect class="box" width="155" height="62" rx="10"/>
    <text class="name" x="77.5" y="27">찬반 투표</text>
    <text class="detail" x="77.5" y="48">전원 투표 또는 10초</text>
  </g>
  <g transform="translate(401 63)">
    <rect class="box" width="191" height="62" rx="10"/>
    <text class="name" x="95.5" y="27">득표 집계</text>
    <text class="detail" x="95.5" y="48">호스트 1.5표 · 참가자 1표</text>
  </g>
  <g transform="translate(629 16)">
    <rect class="box" width="145" height="62" rx="10"/>
    <text class="name" x="72.5" y="27">구매</text>
    <text class="detail" x="72.5" y="48">찬성이 더 많음</text>
  </g>
  <g transform="translate(629 110)">
    <rect class="box" width="145" height="62" rx="10"/>
    <text class="name" x="72.5" y="27">부결</text>
    <text class="detail" x="72.5" y="48">동점 또는 반대 우세</text>
  </g>
  <path class="arrow" d="M168 94 H211" marker-end="url(#tip)"/>
  <path class="arrow" d="M371 94 H396" marker-end="url(#tip)"/>
  <path class="arrow" d="M592 94 H599 Q606 94 606 87 V54 Q606 47 613 47 H624" marker-end="url(#tip)"/>
  <path class="arrow" d="M592 94 H599 Q606 94 606 101 V134 Q606 141 613 141 H624" marker-end="url(#tip)"/>
</svg>
